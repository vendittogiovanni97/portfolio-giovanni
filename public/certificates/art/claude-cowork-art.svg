<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#181818" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle Padding -->
  <rect width="400" height="300" rx="20" fill="#f3e8ff"/>

  <!-- Background Subtle Grid / Dot Pattern -->
  <circle cx="40" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="80" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="320" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="360" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="40" cy="260" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="360" cy="260" r="2.5" fill="#181818" opacity="0.15"/>

  <!-- Center Decorative Circle / Sticker Base -->
  <circle cx="200" cy="140" r="85" fill="#ffffff" stroke="#181818" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="200" cy="140" r="76" fill="#c084fc" stroke="#181818" stroke-width="2" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Icon / Visual Composition -->
  <g transform="translate(200, 140)">
    
  <!-- Twin Spencer Gabor Character Avatars High Fiving -->
  <!-- Left Agent -->
  <circle cx="-24" cy="-6" r="18" fill="#ffffff" stroke="#181818" stroke-width="3.5"/>
  <circle cx="-28" cy="-6" r="3" fill="#181818"/>
  <circle cx="-18" cy="-6" r="3" fill="#181818"/>
  <path d="M -26 2 C -24 5, -20 5, -18 2" stroke="#181818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Right Agent -->
  <circle cx="24" cy="-6" r="18" fill="#ffffff" stroke="#181818" stroke-width="3.5"/>
  <circle cx="18" cy="-6" r="3" fill="#181818"/>
  <circle cx="28" cy="-6" r="3" fill="#181818"/>
  <path d="M 18 2 C 20 5, 24 5, 26 2" stroke="#181818" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Shared Star between them -->
  <path d="M 0 -30 L 4 -20 L 14 -20 L 6 -14 L 9 -4 L 0 -10 L -9 -4 L -6 -14 L -14 -20 L -4 -20 Z" fill="#a855f7" stroke="#181818" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Handshake Connection -->
  <path d="M -12 20 C 0 26, 0 26, 12 20" stroke="#181818" stroke-width="4" stroke-linecap="round"/>

  </g>

  <!-- Top Badge Ribbon -->
  <g transform="translate(200, 36)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#181818"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">COWORK · MULTI-AGENT</text>
  </g>

  <!-- Bottom Official Anthropic Watermark -->
  <g transform="translate(200, 268)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#ffffff" stroke="#181818" stroke-width="2"/>
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#181818" text-anchor="middle" letter-spacing="1">ANTHROPIC CERTIFIED · 2026</text>
  </g>
</svg>