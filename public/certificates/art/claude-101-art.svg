<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#181818" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base with Squircle Padding -->
  <rect width="400" height="300" rx="20" fill="#fef3c7"/>

  <!-- Background Subtle Grid / Dot Pattern -->
  <circle cx="40" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="80" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="320" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="360" cy="40" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="40" cy="260" r="2.5" fill="#181818" opacity="0.15"/>
  <circle cx="360" cy="260" r="2.5" fill="#181818" opacity="0.15"/>

  <!-- Center Decorative Circle / Sticker Base -->
  <circle cx="200" cy="140" r="85" fill="#ffffff" stroke="#181818" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="200" cy="140" r="76" fill="#f59e0b" stroke="#181818" stroke-width="2" stroke-dasharray="4 4" opacity="0.45"/>

  <!-- Icon / Visual Composition -->
  <g transform="translate(200, 140)">
    
  <!-- Spencer Gabor style Character Spark & Face -->
  <path d="M 0 -45 C 10 -20, 20 -10, 45 0 C 20 10, 10 20, 0 45 C -10 20, -20 10, -45 0 C -20 -10, -10 -20, 0 -45 Z" fill="#ffffff" stroke="#181818" stroke-width="4" stroke-linejoin="round"/>
  <!-- Glasses inside Spark -->
  <circle cx="-14" cy="0" r="10" fill="#ffffff" stroke="#181818" stroke-width="3.5"/>
  <circle cx="-13" cy="0" r="3.5" fill="#181818"/>
  <circle cx="14" cy="0" r="10" fill="#ffffff" stroke="#181818" stroke-width="3.5"/>
  <circle cx="15" cy="0" r="3.5" fill="#181818"/>
  <path d="M -4 0 L 4 0" stroke="#181818" stroke-width="3"/>
  <path d="M -6 18 C -2 22, 2 22, 6 18" stroke="#181818" stroke-width="3" fill="none" stroke-linecap="round"/>

  </g>

  <!-- Top Badge Ribbon -->
  <g transform="translate(200, 36)">
    <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#181818"/>
    <text x="0" y="4" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.2">CLAUDE 101 · PROMPT ENG</text>
  </g>

  <!-- Bottom Official Anthropic Watermark -->
  <g transform="translate(200, 268)">
    <rect x="-105" y="-12" width="210" height="24" rx="12" fill="#ffffff" stroke="#181818" stroke-width="2"/>
    <text x="0" y="4" font-family="sans-serif" font-size="10.5" font-weight="800" fill="#181818" text-anchor="middle" letter-spacing="1">ANTHROPIC CERTIFIED · 2026</text>
  </g>
</svg>