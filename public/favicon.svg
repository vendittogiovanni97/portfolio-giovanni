<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Circular White Sticker Background -->
  <circle cx="60" cy="60" r="56" fill="#ffffff" stroke="#181818" stroke-width="4"/>

  <!-- Character Group: Creative Engineer (Spencer Gabor Style) -->
  <!-- Cap / Beanie in Dark Charcoal -->
  <path d="M 32 50 C 32 30, 88 30, 88 50 Z" fill="#181818" stroke="#181818" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Cap Brim / Visor -->
  <path d="M 26 50 C 32 46, 88 46, 94 50 C 94 54, 26 54, 26 50 Z" fill="#181818"/>

  <!-- Face Contour -->
  <path d="M 36 50 C 36 78, 84 78, 84 50" fill="#ffffff" stroke="#181818" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Stylish Round Glasses (Thick Black Frames) -->
  <!-- Left Eye Frame -->
  <circle cx="47" cy="60" r="8.5" fill="#ffffff" stroke="#181818" stroke-width="3"/>
  <circle cx="48" cy="60" r="2.5" fill="#181818"/>
  <!-- Right Eye Frame -->
  <circle cx="73" cy="60" r="8.5" fill="#ffffff" stroke="#181818" stroke-width="3"/>
  <circle cx="72" cy="60" r="2.5" fill="#181818"/>
  <!-- Glasses Bridge -->
  <path d="M 55.5 60 C 58 58, 62 58, 64.5 60" fill="none" stroke="#181818" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose & Smirk / Smile -->
  <path d="M 60 64 L 60 68 L 62 68" fill="none" stroke="#181818" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 50 74 C 55 79, 65 79, 70 74" fill="none" stroke="#181818" stroke-width="3" stroke-linecap="round"/>

  <!-- Ears -->
  <path d="M 36 56 C 32 56, 32 64, 36 64" fill="#ffffff" stroke="#181818" stroke-width="3" stroke-linecap="round"/>
  <path d="M 84 56 C 88 56, 88 64, 84 64" fill="#ffffff" stroke="#181818" stroke-width="3" stroke-linecap="round"/>
</svg>
